version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:80"
      - "5173:5173" # Port untuk Vite (jika menggunakan npm run dev)
    volumes:
      - .:/var/www/html
    depends_on:
      - db


  db:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=e_kinerjaguru
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
